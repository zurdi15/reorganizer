<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Marca Reorganizer: cuadrado void redondeado + silueta de carpeta en
       ámbar cuya abertura es un hexágono de diafragma de cámara (fill-rule
       evenodd talla el hueco). Geometría simple a propósito: legible a 48px. -->
  <rect width="512" height="512" rx="96" fill="#0C0C0E"/>
  <path fill="#F5A93F" fill-rule="evenodd" d="
    M104 128
    h110 l40 44 h154 a28 28 0 0 1 28 28 v184 a28 28 0 0 1 -28 28
    H104 a28 28 0 0 1 -28 -28 V156 a28 28 0 0 1 28 -28 z
    M256 216 l69.3 40 v80 l-69.3 40 l-69.3 -40 v-80 z"/>
  <!-- diafragma interior: hexágono rotado 30° dentro del hueco, como las
       palas de una apertura a medio cerrar -->
  <path fill="none" stroke="#F5A93F" stroke-width="14" d="
    M304 296 l-24 41.6 h-48 l-24 -41.6 l24 -41.6 h48 z"/>
</svg>
